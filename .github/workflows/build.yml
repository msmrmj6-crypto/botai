name: Build mod jar

# Builds the Fabric mod jar on GitHub's own servers (full internet access),
# so you never need Termux, Gradle, or a JDK on your phone at all.
#
# Runs automatically on every push to main, and can also be triggered by
# hand from the "Actions" tab (the "Run workflow" button) if you just want
# to rebuild without changing anything.
on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write   # needed so the "release" job can publish/update a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # No Gradle Wrapper is committed in this repo (generating one needs
      # network access this project's dev sandbox didn't have). This action
      # installs a real Gradle directly on the runner instead.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # fabric-loom 1.14.x needs Gradle's plugin API version 9.2.0,
          # which means Gradle 9.2.0 or newer (not the 8.x line).
          gradle-version: '9.2.0'

      - name: Build the jar
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-carpet-bots-jar
          path: build/libs/*.jar
          if-no-files-found: error

      # Also publish the jar(s) to a single, stable release page so you can
      # download them straight from your phone's browser with one tap -
      # no need to open the "Actions" tab or log in to GitHub for anything.
      - name: Publish to the "latest-build" release
        uses: ncipollo/release-action@v1
        with:
          tag: latest-build
          name: Latest build
          body: |
            Automatically rebuilt from the latest commit on `main`.
            Commit: ${{ github.sha }}

            Download the `.jar` file below and put it in your `mods/`
            folder alongside Fabric API and Carpet.
          artifacts: "build/libs/*.jar"
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
