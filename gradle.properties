# ---------------------------------------------------------------------------
# Minecraft / mapping versions
# ---------------------------------------------------------------------------
# Minecraft 1.21.11 ("Mounts of Mayhem", released 2025-12-09) is the LAST
# Minecraft version that still uses Yarn mappings - everything from 26.1
# onward ships deobfuscated. That is why we still set a yarn_mappings value
# below instead of using loom.officialMojangMappings().
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.3
loader_version=0.18.3

# ---------------------------------------------------------------------------
# Mod version
# ---------------------------------------------------------------------------
mod_version=1.0.0
maven_group=com.aicompanions
archives_base_name=ai-carpet-bots

# ---------------------------------------------------------------------------
# Dependencies
# ---------------------------------------------------------------------------
# Fabric API build for 1.21.11. If Gradle can't resolve this exact string,
# check https://modrinth.com/mod/fabric-api/versions?g=1.21.11 for the
# current one and paste it in here - Fabric API ships very frequently.
fabric_version=0.141.6+1.21.11

# ---------------------------------------------------------------------------
# Gradle / Java
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
